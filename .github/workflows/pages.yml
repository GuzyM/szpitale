name: Deploy HospitalAPP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4
      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zainstaluj zależności
        run: npm ci
      - name: Sprawdź aplikację i dane
        run: npm test && npm run validate:data-hub
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
